
  <!DOCTYPE html>
  <html lang="en">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>AI Destekli Fikir Doğrulama Paneli</title>
      <meta name="description" content="AI destekli panel, girişimcilerin iş fikirlerini analiz eder, riskleri belirler, müşteri soruları oluşturur ve MVP kapsamını optimize ederek doğrulama sürecini kolaylaştırır." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        (function () {
          try {
            var stored = localStorage.getItem("fikirlab_theme");
            if (stored !== "light") document.documentElement.classList.add("dark");
          } catch (e) {
            document.documentElement.classList.add("dark");
          }
        })();
      </script>

    </head>

    <body>

      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>

    </body>
  </html>
